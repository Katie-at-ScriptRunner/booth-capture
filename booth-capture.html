<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Booth Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone form, big tap targets; saved customers listed underneath */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#15202b; --muted:#566574; --line:#d5dce3;
  --accent:#1b5fc4; --accent-ink:#ffffff; --accent-soft:#e3eefc;
  --good:#17784a; --good-soft:#dff3e8; --warn:#9a5b00; --warn-soft:#fdf0d5; --bad:#b3261e; --bad-soft:#fbe3e0;
  --font:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#18212b; --ink:#e8eef4; --muted:#9fb0bf; --line:#2c3a47;
  --accent:#6aa5ff; --accent-ink:#071526; --accent-soft:#1b2f4a;
  --good:#5fd39a; --good-soft:#15332a; --warn:#f0b955; --warn-soft:#3a2d12; --bad:#ff8a80; --bad-soft:#40201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#18212b; --ink:#e8eef4; --muted:#9fb0bf; --line:#2c3a47;
  --accent:#6aa5ff; --accent-ink:#071526; --accent-soft:#1b2f4a;
  --good:#5fd39a; --good-soft:#15332a; --warn:#f0b955; --warn-soft:#3a2d12; --bad:#ff8a80; --bad-soft:#40201d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:16px 120px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:1.1rem;margin:0;text-wrap:balance}
.top{display:flex;flex-direction:column;gap:12px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-family:var(--mono);font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--accent);font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:8px;font-size:.95rem}
.links a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:8px;font-size:.95rem}
form{display:flex;flex-direction:column;gap:16px}
fieldset{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;margin:0;display:flex;flex-direction:column;gap:14px;min-width:0}
legend{font-weight:700;padding-inline:6px;font-size:1.02rem}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label,.lab{font-weight:600;font-size:.98rem}
.hint{color:var(--muted);font-size:.9rem;font-weight:400}
input[type=text],input[type=email],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;min-height:48px;padding:8px 16px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.yes[aria-pressed=true]{background:var(--good);border-color:var(--good);color:#fff}
.chip.no[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.yes[aria-pressed=true],:root:not([data-theme="light"]) .chip.no[aria-pressed=true]{color:#06121c}}
:root[data-theme="dark"] .chip.yes[aria-pressed=true],:root[data-theme="dark"] .chip.no[aria-pressed=true]{color:#06121c}

.check{display:flex;gap:12px;align-items:center;font-weight:600;min-height:48px;padding:6px 2px}.check input{width:26px;height:26px;flex:none}
.cond[hidden]{display:none!important}
details.tori{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0}
details.tori>summary{cursor:pointer;font-weight:700;padding:16px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.tori>summary::-webkit-details-marker{display:none}
details.tori>summary::after{content:"Show / hide";font-weight:500;color:var(--muted);font-size:.88rem}
.toribody{padding:0 16px 16px;display:flex;flex-direction:column;gap:18px}
.q{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q .num{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:5}
.actions .in{max-width:720px;width:100%;display:flex;gap:10px}
.btn{font:inherit;font-weight:700;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:52px;padding:10px 18px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1;font-size:1.05rem}
.btn.small{min-height:44px;padding:6px 14px;font-size:.92rem}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.editing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card h3{margin:0;font-size:1.05rem;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.82rem;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.tag.yes{background:var(--good-soft);color:var(--good)}
.tag.maybe{background:var(--warn-soft);color:var(--warn)}
.tag.no{background:var(--bad-soft);color:var(--bad)}
.cardbtns{display:flex;flex-wrap:wrap;gap:8px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:10;max-width:90vw;text-align:center}
.sectionhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head><body>
<div class="wrap">
  <div class="top">
    <h1>Booth Capture</h1>
    <div class="stats" id="stats" aria-live="polite"></div>
    <div class="links">
      <button class="btn small" id="backupTop" type="button">Download backup</button>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfi_o4EJO2bi6N4HCY5Nf-IK9Koj70W0iY5DtxxSjep5bNVaw/viewform" target="_blank" rel="noopener">Tori's form</a>
      <a href="https://forms.gle/p82gvGDxuTAdArPe6" target="_blank" rel="noopener">Craig's feedback form</a>
      <a href="https://www.userinterviews.com/projects/Le-LVpsdyA/apply" target="_blank" rel="noopener">Mabel's sign-up</a>
    </div>
    
  </div>

  <form id="f" autocomplete="off" novalidate>
    <fieldset>
      <legend id="formtitle">New customer</legend>
      <div class="row2">
        <div class="field"><label for="name">Name</label><input type="text" id="name" enterkeyhint="next"></div>
        <div class="field"><label for="company">Company</label><input type="text" id="company" enterkeyhint="next"></div>
      </div>
      <div class="field"><label for="email">Email</label><input type="email" id="email" inputmode="email" autocapitalize="off" enterkeyhint="next"></div>
    </fieldset>

    <fieldset>
      <legend>Migration</legend>
      <div class="field"><span class="lab" id="l-mig">Are they migrating?</span>
        <div class="chips" data-group="migrating" role="group" aria-labelledby="l-mig">
          <button type="button" class="chip yes" data-v="Yes">Yes</button><button type="button" class="chip no" data-v="No">No</button><button type="button" class="chip" data-v="Unsure">Unsure</button>
        </div></div>
      <div class="cond" id="migmore" hidden>
        <div class="field"><span class="lab" id="l-migp">Which products?</span>
          <div class="chips" data-group="migProducts" data-multi="1" role="group" aria-labelledby="l-migp"></div></div>
        <div class="field" style="margin-top:14px"><label for="migDate">Target date <span class="hint">(e.g. Nov 2026 or 14 Feb)</span></label><input type="text" id="migDate"></div>
      </div>
      <div class="field"><span class="lab" id="l-sms">Do they have SMS access?</span>
        <div class="chips" data-group="sms" role="group" aria-labelledby="l-sms">
          <button type="button" class="chip yes" data-v="Yes">Yes</button><button type="button" class="chip no" data-v="No">No</button><button type="button" class="chip" data-v="Unsure">Unsure</button>
        </div></div>
    </fieldset>

    <fieldset>
      <legend>Interest and problems</legend>
      <div class="field"><span class="lab" id="l-int">Products they are interested in</span>
        <div class="chips" data-group="interested" data-multi="1" role="group" aria-labelledby="l-int"></div></div>
      <div class="field"><label for="problems">Any workflow problems?</label><textarea id="problems"></textarea></div>
      <div class="field"><label for="followup">Follow-up <span class="hint">(optional)</span></label><textarea id="followup" style="min-height:60px"></textarea></div>
    </fieldset>

    <fieldset>
      <legend>Demo and follow-ups</legend>
      <div class="field"><span class="lab" id="l-demo">Did you demo anything?</span>
        <div class="chips" data-group="demo" role="group" aria-labelledby="l-demo">
          <button type="button" class="chip yes" data-v="Yes">Yes</button><button type="button" class="chip no" data-v="No">No</button>
        </div></div>
      <div class="cond" id="demomore" hidden>
        <div class="field"><span class="lab" id="l-demop">Which product?</span>
          <div class="chips" data-group="demoProducts" data-multi="1" role="group" aria-labelledby="l-demop"></div></div>
      </div>
      <label class="check"><input type="checkbox" id="askedTori"> <span>Did you ask them Tori's questions?</span></label>
      <label class="check"><input type="checkbox" id="askedCraig"> <span>Did you ask them Craig's questions?</span></label>
    </fieldset>
  </form>

  <div class="sectionhead">
    <h2>Saved customers <span class="pill" id="count">0</span></h2>
    <div class="cardbtns">
      <button class="btn small" id="copyAll" type="button">Copy all notes</button>
    </div>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="actions"><div class="in">
  <button class="btn" id="clear" type="button">Clear</button>
  <button class="btn primary" id="save" type="button">Save and next</button>
</div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
  var MIG=["SR for Jira","SR for Confluence","Enhanced Search","SR Connect","Behaviours","Other"];
  var INT=["SR for Jira Cloud","SR for Confluence Cloud","Enhanced Search","SR Connect","Automation for Jira","Rovo agent / AI","New UI (Craig's)","Behaviours on JSM","Migration Suite"];
  var DEMO=["SR4J","SR4C","SMS","Connect","Rovo agent","New SR UI","Something else"];
  var $=function(id){return document.getElementById(id)};
  var form={migrating:"",sms:"",migProducts:[],interested:[],demo:"",demoProducts:[]};
  var editingId=null, customers=[], col=null, memMode=false, armed=null, toastT=null;

  function h(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==="class")e.className=attrs[k];else if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){if(c)e.appendChild(c)});return e}
  function toast(msg){var t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2200)}
  function copy(text,okMsg){
    function fallback(){var ta=h("textarea",{style:"position:fixed;opacity:0"});ta.value=text;document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?okMsg:"Copy blocked. Select and copy by hand.")}
    try{navigator.clipboard.writeText(text).then(function(){toast(okMsg)},fallback)}catch(e){fallback()}
  }

  /* chips */
  function buildChips(group,list){var box=document.querySelector('[data-group="'+group+'"]');list.forEach(function(v){box.appendChild(h("button",{type:"button","class":"chip","data-v":v,text:v}))})}
  buildChips("migProducts",MIG);buildChips("interested",INT);
  buildChips("demoProducts",DEMO);

  function paint(){
    document.querySelectorAll('[data-group]').forEach(function(box){
      var g=box.getAttribute("data-group"),multi=box.hasAttribute("data-multi");
      box.querySelectorAll(".chip").forEach(function(c){var v=c.getAttribute("data-v");var on=multi?form[g].indexOf(v)>-1:form[g]===v;c.setAttribute("aria-pressed",on?"true":"false")});
    });
    document.querySelectorAll('[data-tq]').forEach(function(box){
      var i=+box.getAttribute("data-tq");
      box.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",form.tori[i]===c.getAttribute("data-v")?"true":"false")});
    });
    $("migmore").hidden=form.migrating!=="Yes";$("demomore").hidden=form.demo!=="Yes";
  }
  document.addEventListener("click",function(ev){
    var c=ev.target.closest(".chip");if(!c)return;
    var v=c.getAttribute("data-v");
    var tq=c.parentNode.getAttribute("data-tq");
    if(tq!==null){tq=+tq;form.tori[tq]=form.tori[tq]===v?"":v}
    else{var g=c.parentNode.getAttribute("data-group");
      if(c.parentNode.hasAttribute("data-multi")){var i=form[g].indexOf(v);if(i>-1)form[g].splice(i,1);else form[g].push(v)}
      else form[g]=form[g]===v?"":v}
    paint();saveDraft();
  });

  /* draft in browser, per viewer convenience */
  var TEXT=["name","company","email","migDate","problems","followup"];
  function readForm(){var o={migrating:form.migrating,sms:form.sms,migProducts:form.migProducts.slice(),interested:form.interested.slice(),demo:form.demo,demoProducts:form.demoProducts.slice(),askedTori:$("askedTori").checked,askedCraig:$("askedCraig").checked};TEXT.forEach(function(k){o[k]=$(k).value.trim()});return o}
  function fillForm(o){o=o||{};form.migrating=o.migrating||"";form.sms=o.sms||"";form.migProducts=(o.migProducts||[]).slice();form.interested=(o.interested||[]).slice();form.demo=o.demo||"";form.demoProducts=(o.demoProducts||[]).slice();$("askedTori").checked=!!o.askedTori;$("askedCraig").checked=!!o.askedCraig;TEXT.forEach(function(k){$(k).value=o[k]||""});paint()}
  function saveDraft(){if(editingId)return;try{localStorage.setItem("boothDraft",JSON.stringify(readForm()))}catch(e){}}
  function loadDraft(){try{var d=JSON.parse(localStorage.getItem("boothDraft")||"null");if(d)fillForm(d)}catch(e){}}
  $("f").addEventListener("input",saveDraft);

  /* summaries */
  function hasTori(c){return !!c.askedTori}
  function summary(c){
    var L=[(c.name||"(no name)")+", "+(c.company||"(no company)"),c.email?("Email: "+c.email):null,
      "Migrating: "+(c.migrating||"not asked")+(c.migrating==="Yes"?(" | Products: "+((c.migProducts||[]).join(", ")||"not noted")+" | Target: "+(c.migDate||"not noted")):""),
      "SMS access: "+(c.sms||"not asked"),
      "Interested in: "+((c.interested||[]).join(", ")||"none noted"),
      c.problems?("Workflow problems: "+c.problems):null,c.followup?("Follow-up: "+c.followup):null,
      "Demo: "+(c.demo||"not asked")+(c.demo==="Yes"?(" ("+((c.demoProducts||[]).join(", ")||"product not noted")+")"):""),
      "Asked Tori's questions: "+(c.askedTori?"Yes":"No")+" | Asked Craig's questions: "+(c.askedCraig?"Yes":"No")];
    return L.filter(Boolean).join("\n");
  }

  /* store */
  function newId(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
  function persist(){try{localStorage.setItem("boothCustomers",JSON.stringify(customers))}catch(e){toast("Browser storage is full or blocked. Use Download backup.")}}
  function put(id,obj){
    var i=customers.findIndex(function(c){return c.id===id}),isNew=i<0;
    if(isNew)customers.unshift(obj);else customers[i]=obj;
    obj.sync="pending";persist();renderList();
    send(obj,isNew?"create":"update");
    return Promise.resolve();
  }
  function remove(id){customers=customers.filter(function(c){return c.id!==id});persist();renderList();return Promise.resolve()}

  function save(){
    var o=readForm();
    if(!o.name&&!o.company){toast("Add a name or company first");$("name").focus();return}
    var now=Date.now(),id=editingId||newId(),prev=customers.find(function(c){return c.id===id});
    o.id=id;o.createdAt=prev?prev.createdAt:now;o.updatedAt=now;
    var wasEdit=!!editingId;
    $("save").disabled=true;
    put(id,o).then(function(){
      toast(wasEdit?"Updated":"Saved. Next customer");
      endEdit();fillForm({});try{localStorage.removeItem("boothDraft")}catch(e){}
      window.scrollTo({top:0,behavior:"smooth"});$("name").focus({preventScroll:true});
    }).catch(function(e){toast("Not saved: "+((e&&e.message)||"try again"))}).then(function(){$("save").disabled=false});
  }
  function endEdit(){editingId=null;$("formtitle").textContent="New customer";$("save").textContent="Save and next";$("clear").textContent="Clear";renderList()}
  function startEdit(c){editingId=c.id;fillForm(c);$("formtitle").textContent="Editing "+(c.name||c.company);$("save").textContent="Update customer";$("clear").textContent="Cancel";renderList();window.scrollTo({top:0,behavior:"smooth"})}
  $("save").addEventListener("click",save);
  $("clear").addEventListener("click",function(){if(editingId){endEdit();fillForm({});try{var d=localStorage.getItem("boothDraft");if(d)fillForm(JSON.parse(d))}catch(e){}}else{fillForm({});try{localStorage.removeItem("boothDraft")}catch(e){}$("name").focus()}});
  document.addEventListener("keydown",function(e){if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();save()}});

  /* list */
  function renderStats(){
    var withT=customers.filter(hasTori).length;
    var s=$("stats");s.textContent="";
    s.appendChild(h("span",{"class":"pill",text:customers.length+" captured"}));
    s.appendChild(h("span",{"class":"pill"+(withT>=2?" ok":""),text:withT+" of 2 Tori chats (due Thu 8 Oct)"}));
    var un=customers.filter(function(c){return c.sync!=="sent"&&c.sync!=="unconfirmed"}).length;
    if(HOOK_URL&&un)s.appendChild(h("span",{"class":"pill",text:un+" not sent to Connect"}));
    $("count").textContent=customers.length;
  }
  function renderList(){
    renderStats();
    var L=$("list");L.textContent="";
    if(!customers.length){L.appendChild(h("div",{"class":"empty",text:"Nothing saved yet. Fill in the form above and tap Save and next. Each save becomes a card here."}));return}
    customers.forEach(function(c){
      var tags=[];
      if(c.migrating)tags.push(h("span",{"class":"tag "+(c.migrating==="Yes"?"yes":c.migrating==="No"?"no":"maybe"),text:"Migrating: "+c.migrating+(c.migrating==="Yes"&&c.migDate?" ("+c.migDate+")":"")}));
      if(c.sms)tags.push(h("span",{"class":"tag "+(c.sms==="Yes"?"yes":c.sms==="No"?"no":"maybe"),text:"SMS: "+c.sms}));
      (c.migProducts||[]).forEach(function(p){tags.push(h("span",{"class":"tag",text:"Migrating "+p}))});
      (c.interested||[]).forEach(function(p){tags.push(h("span",{"class":"tag",text:p}))});
      var sl={sent:"Saved and sent",unconfirmed:"Sent (no reply visible)",failed:"Not sent",pending:"Sending...",local:"Saved in this browser"}[c.sync||"local"];
      tags.push(h("span",{"class":"tag "+((c.sync==="sent"||c.sync==="unconfirmed")?"yes":"maybe"),text:sl}));
      if(c.demo==="Yes")(c.demoProducts||[]).forEach(function(p){tags.push(h("span",{"class":"tag yes",text:"Demo: "+p}))});
      else if(c.demo==="No")tags.push(h("span",{"class":"tag",text:"No demo"}));
      if(c.askedTori)tags.push(h("span",{"class":"tag yes",text:"Tori asked"}));
      if(c.askedCraig)tags.push(h("span",{"class":"tag yes",text:"Craig asked"}));
      var kids=[h("h3",{text:(c.name||"(no name)")+(c.company?", "+c.company:"")})];
      if(c.email)kids.push(h("div",{"class":"meta",text:c.email}));
      if(tags.length)kids.push(h("div",{"class":"tags"},tags));
      if(c.problems)kids.push(h("div",{"class":"meta",text:"Problems: "+c.problems}));
      var b1=h("button",{type:"button","class":"btn small",text:"Edit"});b1.onclick=function(){startEdit(c)};
      var b2=h("button",{type:"button","class":"btn small",text:"Copy notes"});b2.onclick=function(){copy(summary(c),"Notes copied")};
      var cb=[b1,b2];
      var b4=h("button",{type:"button","class":"btn small danger"+(armed===c.id?" armed":""),text:armed===c.id?"Tap again to delete":"Delete"});
      b4.onclick=function(){if(armed===c.id){armed=null;remove(c.id).then(function(){toast("Deleted")})}else{armed=c.id;renderList();setTimeout(function(){if(armed===c.id){armed=null;renderList()}},3000)}};
      cb.push(b4);
      kids.push(h("div",{"class":"cardbtns"},cb));
      L.appendChild(h("div",{"class":"card"+(editingId===c.id?" editing":"")},kids));
    });
  }
  $("backupTop").addEventListener("click",backup);
  $("copyAll").addEventListener("click",function(){if(!customers.length){toast("Nothing to copy yet");return}copy(customers.map(summary).join("\n\n---\n\n"),"All notes copied")});


  /* Send to ScriptRunner Connect webhook */
  function payload(c,action){
    var o={action:action,id:c.id,createdAt:new Date(c.createdAt).toISOString(),updatedAt:new Date(c.updatedAt).toISOString(),
      name:c.name||"",company:c.company||"",email:c.email||"",migrating:c.migrating||"",migrationProducts:c.migProducts||[],migrationTargetDate:c.migDate||"",
      smsAccess:c.sms||"",interestedIn:c.interested||[],workflowProblems:c.problems||"",followUp:c.followup||"",
      demo:c.demo||"",demoProducts:c.demoProducts||[],askedToriQuestions:!!c.askedTori,askedCraigQuestions:!!c.askedCraig,summary:summary(c)};
    return o;
  }
  function send(c,action){
    var url=HOOK_URL;
    if(!url){c.sync="local";persist();renderList();return Promise.resolve()}
    var body=JSON.stringify(payload(c,action));
    return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:body}).then(function(r){
      c.sync=r.ok?"sent":"failed";
    },function(){
      return fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:body}).then(function(){c.sync="unconfirmed"},function(){c.sync="failed"});
    }).then(function(){persist();renderList();if(c.sync==="failed")toast("Saved here. Not sent to Connect yet")});
  }
  function backup(){
    var blob=new Blob([JSON.stringify(customers,null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="booth-capture-backup.json";document.body.appendChild(a);a.click();a.remove();
  }
  var HOOK_URL=""; /* leave empty: notes stay in this browser */

  /* start */
  try{customers=JSON.parse(localStorage.getItem("boothCustomers")||"[]")}catch(e){customers=[]}
    paint();loadDraft();renderList();
})();
</script>
